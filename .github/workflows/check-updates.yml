name: Check Plugin Updates

on:
  schedule:
    - cron: '0 */6 * * *'          # 每 6 小时运行一次
  workflow_dispatch:               # 允许手动触发
    inputs:
      trace_id:
          description: "Caller trace id"
          required: false
          type: string
          default: ""

permissions:
  contents: write                  # 允许修改 plugins.json 并 push
  actions: write                   # 允许触发其他 workflow

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check and update plugins.json
        run: node scripts/check-updates.js

      # 将修改暂存
      - name: Stage changes
        run: git add plugins.json

      # 判断是否有实质修改（staged 区域是否有变动）
      - name: Check if there are changes
        id: check_changes
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 只有存在改动时才提交并推送
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-update plugins.json with latest versions"
          git push

      # 只有存在改动时才触发部署 workflow
      - name: Trigger deploy workflow
        if: steps.check_changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-plugins.yml --ref main -f trace_id="$TRACE_ID"
          env:
            TRACE_ID: ${{ inputs.trace_id }}